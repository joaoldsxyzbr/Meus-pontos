name: Validar PWA

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências da versão fixa
        run: npm ci --ignore-scripts
      - name: Conferir componentes Svelte e TypeScript
        run: npm run check:frontend
      - name: Construir piloto Svelte sem tocar nos assets de produção
        run: npm run build:frontend
      - name: Construir pacote PWA de homologação isolado
        run: npm run build:staging
      - name: Testar configuração e política de cache do staging
        run: npm run test:staging
      - name: Construir e validar pacote Svelte para substituição futura
        run: |
          npm run build:release
          npm run test:release
      - name: Validar pacote Wrangler de release sem deploy ou token
        run: npx --no-install wrangler deploy --config wrangler.jsonc --dry-run --outdir dist/wrangler-release-check
      - name: Verificar contratos TypeScript
        run: npm run typecheck
      - name: Testar JavaScript existente
        run: npm test
      - name: Integrar Worker e D1 local no runtime workerd
        run: npm run test:workers
      - name: Testar PWA Svelte com API HTTP real e D1 local
        run: node --test scripts/staging-http.test.mjs
      - name: Testar configuração real do Worker Svelte com D1 local descartável
        run: E2E_RELEASE_LOCAL=1 node --test scripts/staging-http.test.mjs
      - name: Testar migrações SQL SQLite
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Verificar sintaxe
        run: |
          node --check src/worker.js
          node --check src/corrections.js
          node --check src/schedule.js
  browser:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar dependências e piloto Svelte no runner de navegador
        run: |
          npm ci --ignore-scripts
          npm run build:frontend
      - name: Smoke test do piloto Svelte em Chrome desktop/mobile
        run: node --test scripts/browser-svelte-smoke.mjs
      - name: Testar bundle PWA de homologação em Chrome
        run: |
          npm run build:staging
          PILOT_ROOT=dist/staging node --test scripts/browser-svelte-smoke.mjs
      - name: Testar pacote final Svelte em Chrome desktop/mobile
        run: |
          npm run build:release
          PILOT_ROOT=dist/release node --test scripts/browser-svelte-smoke.mjs
