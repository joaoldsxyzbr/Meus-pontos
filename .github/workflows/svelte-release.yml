name: Publicar Svelte 5 — troca manual com rollback

on:
  workflow_dispatch:
    inputs:
      confirmacao:
        description: "Digite PUBLICAR_SVELTE_5 para confirmar a troca da interface"
        required: true
        type: string
      backup:
        description: "Digite BACKUP_E_RESTAURACAO_VERIFICADOS após testar cópia privada atualizada do D1"
        required: true
        type: string
      rollback:
        description: "Digite ROLLBACK_PREPARADO após registrar versão anterior estável e procedimento de reversão"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-meus-pontos-production
  cancel-in-progress: false

jobs:
  publicar:
    name: Validar e publicar Svelte 5 de forma controlada
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validar autorização manual e main
        env:
          CONFIRMACAO: ${{ inputs.confirmacao }}
          BACKUP_CONFIRMADO: ${{ inputs.backup }}
          ROLLBACK_CONFIRMADO: ${{ inputs.rollback }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ] ||
             [ "$CONFIRMACAO" != "PUBLICAR_SVELTE_5" ] ||
             [ "$BACKUP_CONFIRMADO" != "BACKUP_E_RESTAURACAO_VERIFICADOS" ] ||
             [ "$ROLLBACK_CONFIRMADO" != "ROLLBACK_PREPARADO" ]; then
            echo "::error::Autorização, backup/restauração ou rollback não confirmados."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dependências reproduzíveis
        run: npm ci --ignore-scripts
      - name: Verificação de código e contratos
        run: |
          npm run typecheck
          npm run check:frontend
          npm test
          npm run test:workers
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Construir e validar nova PWA sem dados reais
        run: |
          npm run build:release
          npm run test:release
          node --test scripts/staging-http.test.mjs
      - name: Testes Chrome do bundle final
        run: PILOT_ROOT=dist/release node --test scripts/browser-svelte-smoke.mjs
      - name: Verificar token de publicação
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Credenciais de produção não configuradas."
            exit 1
          fi
      - name: Compilar Worker sem publicar (dry-run)
        run: npx --no-install wrangler deploy --config wrangler.release.jsonc --dry-run --outdir dist/wrangler-release-check
      - name: Publicar somente Worker e assets Svelte — D1 não é migrado
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --no-install wrangler deploy --config wrangler.release.jsonc
