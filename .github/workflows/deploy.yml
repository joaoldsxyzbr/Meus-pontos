name: Publicação de emergência (alternativa ao Workers Builds)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-meus-pontos-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Validar e publicar Worker + PWA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências fixadas
        run: npm ci --ignore-scripts
      - name: Verificações TypeScript, Svelte e pacote final
        run: |
          npm run typecheck
          npm run check:frontend
          npm run build:release
          npm run test:release
      - name: Testes JavaScript
        run: npm test
      - name: Testes de integração no Workers e D1 local
        run: npm run test:workers
      - name: Testes de integridade do D1 em SQLite
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Smoke test do pacote final em Chrome
        run: PILOT_ROOT=dist/release node --test scripts/browser-svelte-smoke.mjs
      - name: Integração HTTP local do pacote de produção
        run: E2E_RELEASE_LOCAL=1 node --test scripts/staging-http.test.mjs
      - name: Confirmar credenciais de implantação
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Configure CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID nos Actions secrets antes de executar este workflow."
            exit 1
          fi
      - name: Implantar Worker e arquivos do PWA
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --no-install wrangler deploy
