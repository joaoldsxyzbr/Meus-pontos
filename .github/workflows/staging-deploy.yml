name: Implantar homologação Svelte isolada

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-meus-pontos-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Validar e implantar staging sem endpoints públicos
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Proibir deploy fora da main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Staging só pode ser implantado a partir da main."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências travadas
        run: npm ci --ignore-scripts
      - name: Verificar tipos e componentes
        run: |
          npm run typecheck
          npm run check:frontend
      - name: Reexecutar testes de domínio e runtime D1 isolado
        run: |
          npm test
          npm run test:workers
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Construir e validar pacote de staging
        run: |
          npm run build:staging
          npm run test:staging
      - name: Conferir segredos exclusivos de staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Segredos de staging ausentes; não fazer deploy."
            exit 1
          fi
      - name: Implantar Worker staging sem workers.dev ou previews
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --no-install wrangler deploy --config wrangler.staging.jsonc
